name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please-main
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Create draft from merged release PR
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ github.token }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true
      - name: Check for unpublished releases
        id: drafts
        if: steps.release.outputs.release_created != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          DRAFT_TAGS="$(gh api --paginate "repos/$GH_REPO/releases" --jq '.[] | select(.draft) | .tag_name')"
          if [[ -n "$DRAFT_TAGS" ]]; then
            echo "::notice::Release PR generation is paused until draft releases are published: $DRAFT_TAGS"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Create or update release PR
        if: steps.release.outputs.release_created != 'true' && steps.drafts.outputs.ready == 'true'
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ github.token }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true

  build-release:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
      source-ref: ${{ github.sha }}
    secrets: inherit

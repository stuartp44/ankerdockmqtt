name: Build and publish release

on:
  workflow_call:
    inputs:
      tag:
        description: Existing stable version tag to build and publish
        required: true
        type: string
      source-ref:
        description: Commit to build before the draft release tag exists
        required: false
        type: string
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish (for example v0.3.0)
        required: true
        type: string
      source-ref:
        description: Optional commit to build if the release tag does not exist yet
        required: false
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-ref || inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: mac-x64
            runner: macos-15-intel
            target: mac
            arch: x64
          - id: mac-arm64
            runner: macos-15
            target: mac
            arch: arm64
          - id: windows-x64
            runner: windows-latest
            target: win
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-ref || inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Validate tag and package version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Expected a stable semantic version tag such as v0.3.0; got: $RELEASE_TAG" >&2
            exit 1
          fi
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [[ "$PACKAGE_VERSION" != "${RELEASE_TAG#v}" ]]; then
            echo "Tag $RELEASE_TAG does not match package.json version $PACKAGE_VERSION" >&2
            exit 1
          fi
      - run: npm ci
      - name: Build app package
        run: npm run dist:${{ matrix.target }} -- --${{ matrix.arch }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.id }}
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error
          retention-days: 2

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-ref || inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Sign release SHA-256 manifest
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY }}
        run: node scripts/sign-update-manifest.js "$RELEASE_TAG" dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          RELEASE_TARGET: ${{ inputs.source-ref || inputs.tag || github.ref }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              dist/*.exe dist/*.zip \
              dist/update-manifest.json dist/update-manifest.json.sig \
              --clobber
            gh release edit "$RELEASE_TAG" --target "$RELEASE_TARGET" --draft=false
          else
            gh release create "$RELEASE_TAG" \
              dist/*.exe dist/*.zip \
              dist/update-manifest.json dist/update-manifest.json.sig \
              --verify-tag \
              --title "Dock MQTT ${RELEASE_TAG#v}" \
              --generate-notes
          fi
